<!DOCTYPE html>
<html>
<head>
    <title>Infinity8</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://raw.githubusercontent.com/viktorhridin24-maker/In8/9e931e14cebe925ef8764f40942886f362945808/In8.png" type="image/x-icon">
</head>
<body>
 <div class="In8historychat">
    <div class="leftside">
      <div class="Infinity8logo">
        <img src="https://raw.githubusercontent.com/viktorhridin24-maker/In8/9e931e14cebe925ef8764f40942886f362945808/In8.png" width="50">
        <h1>Infinity8</h1>
      </div>
      <img src="https://raw.githubusercontent.com/viktorhridin24-maker/In8/c92f9a7abc7135d175939fb8a3db0c972f1989f1/chatin8.png" class="chatnon">
      <h3>История чата будет сделан позже.</h3>
    </div>

    <button class="vktrprofile" onclick="window.location.href='https://vktrteam.net/'">
        <img src="https://github.com/viktorhridin24-maker/vktr/blob/main/vktriduser.png?raw=true" width="50" class="avataricon">
        <p>Регистрация с vktrID не сделана.</p>
    </button>
 </div>
<div class="theonestchat">
   <div class="logoinchat">
    <img src="https://github.com/viktorhridin24-maker/In8/blob/main/In8.png?raw=true" width="50">
    <span class="chattext">Шоу начинается, не так ли?</span>
   </div>
<form id="agreementForm" class="warning">
    <a href="https://vktrteam.net/">
        <img src="https://vktrteam.net/vktrteamicon.png" width="50">
    </a>
    <h3>Информация</h3>
    <p>Смотря проекты в BETA-режиме, вы должны подтвердить, что вы соглашаетесь с правилами vktrteam.net. Потому что осваивая правила этой команды, вы сможете пользоватся сервисами их же команды.</p>
    <div>
        <input type="checkbox" id="rulesCheckbox" required>
        <label for="rulesCheckbox">Я соглашаюсь с правилами vktr team</label>
    </div>
    
    <button type="button" id="confirmBtn">Подтвердить</button>
</form>
    <div class="idontkhow">
      <button class="textauto">
      <img src="https://github.com/viktorhridin24-maker/In8/blob/main/pen.png?raw=true" width="20">
      <p>Писать</p>
      </button>
      <button class="learnauto">
      <img src="https://github.com/viktorhridin24-maker/In8/blob/main/learn.png?raw=true" width="20">
      <p>Учить</p>
      </button>
      <button class="workauto">
      <img src="https://github.com/viktorhridin24-maker/In8/blob/main/work%20(1).png?raw=true" width="20">
      <p>Работа</p>
      </button>
    </div>
   <div class="sameschat">
    <input type="text" class="gochat" placeholder="Чем помочь?" required>
    <button class="instruments">
    ﻿   +  ﻿
    </button>
    <select class="model">
      <option value="claude">???</option>
        <option value="sonnet-low">???</option>
    </select>
   </div>

<script>
  const chatInput = document.querySelector('.gochat');
  const btnOption1 = document.querySelector('.option1');
  const btnOption2 = document.querySelector('.option2');
  const btnOption3 = document.querySelector('.option3');

  btnOption1.addEventListener('click', () => {
    chatInput.value = 'Привет, In8! Я интересуюсь матчем ЧМ-2026. Как проходят обстоятельства?';
    chatInput.focus();
  });

  btnOption2.addEventListener('click', () => {
    chatInput.value = 'Привет, In8! Кто, по твоему мнению, победит в текущем этапе ЧМ-2026 и почему?';
    chatInput.focus();
  });

  btnOption3.addEventListener('click', () => {
    chatInput.value = 'Привет, подскажи, где можно официально и в хорошем качестве посмотреть трансляцию ЧМ-2026?';
    chatInput.focus();
  });

const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', function() {
      const checkbox = document.getElementById('rulesCheckbox');
      if (checkbox && checkbox.checked) {
        document.querySelector('.warning').style.display = 'none';
      } else {
        alert("Поставьте галочку на то, что вы согласны с правилами команды vktr team.");
      }
    });
  }
</script>
</body>
</html>
