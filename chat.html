<!DOCTYPE html>
<html>
<head>
    <title>Infinity8</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://raw.githubusercontent.com/viktorhridin24-maker/In8/9e931e14cebe925ef8764f40942886f362945808/In8.png" type="image/x-icon">
</head>
<body>
 <div class="In8historychat">
    <div class="leftside">
      <div class="Infinity8logo">
        <h1>Infinity8</h1>
        <div class="beta">BETA</div>
      </div>
      <img src="https://raw.githubusercontent.com/viktorhridin24-maker/In8/c92f9a7abc7135d175939fb8a3db0c972f1989f1/chatin8.png" class="chatnon">
      <h3>История чата будет сделан позже.</h3>
    </div>

    <button class="vktrprofile" onclick="window.location.href='https://vktrteam.net/'">
        <img src="https://github.com/viktorhridin24-maker/vktr/blob/main/vktriduser.png?raw=true" width="50" class="avataricon">
        <p>Регистрация с vktrID не сделана.</p>
    </button>
 </div>
 <div class="theonestchat">
<div class="sameschat">
    <input type="text" class="gochat" id="chatInput" placeholder="Чем помочь?" required>
    <div class="sameschatbuttons">
    <button type="button" class="instruments">
    ﻿   +  ﻿
    </button>
    <select class="model" disabled>
      <option value="claude">???</option>
        <option value="sonnet-low">???</option>
    </select>
</div>
<div class="aidisclaimer">
  <a href="https://telegra.ph/O-gallyucinacii-Infinity8-07-03">
  <p>In8 - это ИИ. Он может говорить всякий бред</p>
  </a>
</div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
  const chatInput = document.getElementById('chatInput') || document.querySelector('.gochat');
  const chatContainer = document.querySelector('.theonestchat');

  if (!chatInput) {
    console.error("Ой, поле ввода .gochat не найдено на странице!");
    return;
  }

  console.log("Скрипт чата успешно запущен, поле ввода найдено!");

  chatInput.addEventListener('keydown', async (event) => {
    if (event.key === 'Enter') {
      const userText = chatInput.value.trim();
      console.log("Нажали Enter, текст:", userText);

      if (userText === '') return;

      chatInput.value = ''; // Очищаем поле ввода

      const sameschatBlock = document.querySelector('.sameschat');

      // 1. Создаем блок с сообщением пользователя
      const userMessageDiv = document.createElement('div');
      userMessageDiv.className = 'usermessage';
      userMessageDiv.innerHTML = `<p>${escapeHtml(userText)}</p>`;
      chatContainer.appendChild(userMessageDiv); // Вместо insertBefore

      // 2. Создаем блок для ответа ИИ (с текстом загрузки)
      const aiMessageDiv = document.createElement('div');
      aiMessageDiv.className = 'ansverin8';
      aiMessageDiv.innerHTML = `<p>Думаю над ответом...</p>`;
      chatContainer.appendChild(aiMessageDiv); // Вместо insertBefore

try {
        // 3. Запрос к нашему бэкенду на Vercel в правильном формате
        const response = await fetch('https://in8proxymistral.vercel.app/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [{ role: 'user', content: userText }]
          })
        });

        const data = await response.json();
        console.log("Ответ от сервера:", data);

        if (response.ok && data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          aiMessageDiv.innerHTML = `<p>${escapeHtml(aiReply).replace(/\n/g, '<br>')}</p>`;
        } else {
          aiMessageDiv.innerHTML = `<p style="color: #ff6b6b;">Ошибка API: ${escapeHtml(data.error?.message || JSON.stringify(data))}</p>`;
        }
      } catch (err) {
        console.error("Ошибка сети:", err);
        aiMessageDiv.innerHTML = `<p style="color: #ff6b6b;">Сетевая ошибка соединения.</p>`;
      }
    }
  });

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }
});
</script>
</body>
</html>
